name: Build Chaoscope iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-15   # Apple Silicon, Xcode 16.x (format-77 project files)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios

      # ── Simulator build (fast compile check, no signing needed) ────────────
      - name: Build for simulator
        run: |
          xcodebuild \
            -project ios/Chaoscope.xcodeproj \
            -scheme Chaoscope \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # ── Device build — produces the .app we'll package as an .ipa ──────────
      - name: Build for device (unsigned)
        run: |
          xcodebuild \
            -project ios/Chaoscope.xcodeproj \
            -scheme Chaoscope \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64

      # ── Package unsigned .ipa ───────────────────────────────────────────────
      # An unsigned .ipa can be re-signed locally with Sideloadly (Windows/Mac)
      # or AltStore using a free Apple ID for 7-day sideloading to a real device.
      - name: Package unsigned .ipa
        run: |
          APP=$(find build/ios-device/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: no .app found in derived data" && exit 1
          fi
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r Chaoscope-unsigned.ipa Payload/
          rm -rf Payload
          echo "Packaged: $(du -sh Chaoscope-unsigned.ipa | cut -f1)"

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Chaoscope-iOS-unsigned
          path: Chaoscope-unsigned.ipa
          retention-days: 14
