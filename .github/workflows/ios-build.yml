name: Build Chaoscope iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # The gradle action needs to know where to find the build configuration files
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        build-root-directory: ./android

    # Added 'working-directory: ./android' so it runs inside your folder
    - name: Compile Kotlin iOS Target
      run: ./gradlew :composeApp:compileReleaseKotlinIosArm64
      working-directory: ./android

    # Adjusted paths so Xcode finds the iosApp shell project inside the android folder
    - name: Build Xcode Project
      run: |
        cd iosApp
        xcodebuild -project iosApp.xcodeproj \
                   -scheme iosApp \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   BUILD_DIR=../build/ios-outputs
      working-directory: ./android

    # Uploads the final app bundle out of the android subdirectory targets
    - name: Upload Compiled App
      uses: actions/upload-artifact@v4
      with:
        name: chaoscope-ios-app
        path: android/build/ios-outputs/Release-iphoneos/iosApp.app