name: Build Chaoscope iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # Removed the invalid 'build-root-directory' input entirely
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Run the native compilation explicitly scoped inside the android directory
    - name: Compile Kotlin iOS Target
      run: ./gradlew :composeApp:compileReleaseKotlinIosArm64
      working-directory: ./android

    # Build the structural Xcode container matching your directory mapping
    - name: Build Xcode Project
      run: |
        cd iosApp
        xcodebuild -project iosApp.xcodeproj \
                   -scheme iosApp \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   BUILD_DIR=../build/ios-outputs
      working-directory: ./android

    # Compress and upload the built framework artifact
    - name: Upload Compiled App
      uses: actions/upload-artifact@v4
      with:
        name: chaoscope-ios-app
        path: android/build/ios-outputs/Release-iphoneos/iosApp.app